name: Ejecutar Bot de Campers

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install requests

      - name: Ejecutar Bot
        run: python bot.py
