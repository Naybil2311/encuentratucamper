print(f"Total de anuncios a procesar: {len(lista_anuncios)}")

# 2. Subir a Supabase
insertados = 0
for a in lista_anuncios:
    try:
        r = requests.post(f"{SUPABASE_URL}/rest/v1/anuncios", json=a, headers=headers)
        if r.status_code in [200, 201]:
            insertados += 1
            print(f"✓ [{r.status_code}] Guardado: {a['title']}")
        else:
            print(f"× [{r.status_code}] Error en: {a['title']}")
    except Exception as e:
        print(f"Error conectando a Supabase para {a['title']}: {e}")

print(f"Proceso finalizado. Total de anuncios insertados con éxito: {insertados}")
