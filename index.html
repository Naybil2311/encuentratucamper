<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EncuentraTuCamper | Buscador de Campers y Autocaravanas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3">
                <i class="fa-solid fa-van-shuttle text-brand-600 text-2xl"></i>
                <span class="text-xl font-bold text-slate-900">EncuentraTu<span class="text-brand-600">Camper</span></span>
            </a>
            <button onclick="toggleModal(true)" class="bg-brand-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-brand-700 transition-colors">
                <i class="fa-solid fa-plus mr-1"></i> Vender Camper
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div id="ads-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-brand-600"></i>
                <p>Cargando catálogo en tiempo real...</p>
            </div>
        </div>
    </main>

    <!-- Modal Detalle -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl relative max-h-[90vh] flex flex-col">
            <button onclick="toggleDetailModal(false)" class="absolute top-4 right-4 z-10 bg-slate-900/60 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-slate-900">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="detail-content" class="overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://agazyoihnkienkywbpxe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_eCIDgVWRog9savmDZJ1Z-Q_RRYIHMj4';
        const FALLBACK_IMG = 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=800&q=80';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allAds = [];

        async function fetchAds() {
            try {
                const { data, error } = await supabaseClient.from('anuncios').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                allAds = data || [];
                renderAds(allAds);
            } catch (err) {
                console.error("Error al cargar:", err);
            }
        }

        function renderAds(ads) {
            const grid = document.getElementById('ads-grid');
            if (!ads.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No hay vehículos disponibles.</div>`;
                return;
            }

            grid.innerHTML = ads.map((ad, idx) => `
                <article onclick="openDetail(${idx})" class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg transition-all cursor-pointer flex flex-col">
                    <div class="h-48 bg-slate-100 relative overflow-hidden">
                        <img src="${ad.image || FALLBACK_IMG}" 
                             onerror="this.onerror=null; this.src='${FALLBACK_IMG}';" 
                             alt="${ad.title}" 
                             class="w-full h-full object-cover">
                        <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-white text-xs font-semibold px-2.5 py-1 rounded-full">
                            ${ad.type || 'Camper'}
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-slate-900 text-lg line-clamp-1 mb-2">${ad.title}</h3>
                            <p class="text-2xl font-black text-brand-600 mb-4">${Number(ad.price || 0).toLocaleString('es-ES')} €</p>
                            <div class="grid grid-cols-2 gap-2 text-xs text-slate-500 mb-4 bg-slate-50 p-2.5 rounded-lg">
                                <div><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i> ${ad.location || 'España'}</div>
                                <div><i class="fa-solid fa-calendar text-slate-400 mr-1"></i> ${ad.year || 'N/D'}</div>
                            </div>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                            <span>Fuente: <strong class="text-slate-600">${ad.source || 'Directo'}</strong></span>
                            <span class="bg-brand-50 text-brand-700 px-2.5 py-1 rounded-full font-semibold">Ver detalle &rarr;</span>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function openDetail(index) {
            const ad = allAds[index];
            if (!ad) return;

            const content = `
                <div class="h-64 sm:h-80 bg-slate-100 relative">
                    <img src="${ad.image || FALLBACK_IMG}" onerror="this.onerror=null; this.src='${FALLBACK_IMG}';" class="w-full h-full object-cover">
                </div>
                <div class="p-6">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">${ad.title}</h2>
                    <p class="text-3xl font-black text-brand-600 mb-6">${Number(ad.price || 0).toLocaleString('es-ES')} €</p>
                    <a href="${ad.url || '#'}" target="_blank" rel="noopener noreferrer" class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-6 py-2.5 rounded-xl transition-colors inline-block">
                        <i class="fa-solid fa-up-right-from-square mr-2"></i> Ir al Anuncio Original (${ad.source})
                    </a>
                </div>
            `;
            document.getElementById('detail-content').innerHTML = content;
            toggleDetailModal(true);
        }

        function toggleDetailModal(show) {
            document.getElementById('detail-modal').classList.toggle('hidden', !show);
        }

        fetchAds();
    </script>
</body>
</html>
