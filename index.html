<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EncuentraTuCamper | Agregador de Campers y Autocaravanas</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN (SDK v2) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.reload()">
                <i class="fa-solid fa-van-shuttle text-brand-600 text-2xl"></i>
                <span class="text-xl font-bold text-slate-900 tracking-tight">EncuentraTu<span class="text-brand-600">Camper</span></span>
            </div>
            <button onclick="toggleModal(true)" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center space-x-2 shadow-sm">
                <i class="fa-solid fa-plus"></i>
                <span>Vender Camper</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-slate-900 text-white py-12 px-4 relative overflow-hidden">
        <div class="max-w-4xl mx-auto text-center relative z-10">
            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4">El agregador #1 de Vanlife en España</h1>
            <p class="text-slate-300 text-base sm:text-lg mb-8">Encuentra tu camper, gran volumen o autocaravana ideal recopilada en tiempo real de múltiples fuentes.</p>
            
            <div class="bg-white p-2 rounded-xl shadow-lg flex flex-col sm:flex-row gap-2 max-w-2xl mx-auto text-slate-800">
                <div class="flex-1 flex items-center px-3 bg-slate-50 rounded-lg border border-slate-200">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 mr-2"></i>
                    <input type="text" id="search-input" onkeyup="filterAds()" placeholder="Buscar por modelo o ubicación (ej: California, Ducato, Madrid...)" class="w-full bg-transparent py-2 focus:outline-none text-sm">
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content / Dashboard -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <!-- Filtros Rápidos -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-8 flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Categoría:</span>
                <select id="filter-type" onchange="filterAds()" class="bg-slate-50 border border-slate-200 text-sm rounded-lg p-2 focus:ring-brand-500">
                    <option value="Todas">Todas</option>
                    <option value="Furgoneta Camper">Furgoneta Camper</option>
                    <option value="Gran Volumen">Gran Volumen</option>
                    <option value="Autocaravana">Autocaravana</option>
                </select>

                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-2">Plazas:</span>
                <select id="filter-sleeps" onchange="filterAds()" class="bg-slate-50 border border-slate-200 text-sm rounded-lg p-2 focus:ring-brand-500">
                    <option value="0">Cualquiera</option>
                    <option value="2">2+ Plazas</option>
                    <option value="4">4+ Plazas</option>
                </select>
            </div>
            <div class="text-sm text-slate-500">
                Anuncios disponibles: <span id="ad-count" class="font-bold text-slate-800">0</span>
            </div>
        </div>

        <!-- Grid de Anuncios -->
        <div id="ads-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-brand-600"></i>
                <p>Cargando catálogo en tiempo real desde Supabase...</p>
            </div>
        </div>
    </main>

    <!-- Modal Vender Camper -->
    <div id="sell-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-slate-900 mb-4">Publicar Anuncio Gratis</h3>
            
            <form onsubmit="publicarAnuncio(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Título del Anuncio *</label>
                    <input type="text" id="input-title" required placeholder="Ej: Volkswagen California T6 Beach" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Precio (€) *</label>
                        <input type="number" id="input-price" required placeholder="35000" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Categoría *</label>
                        <select id="input-type" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                            <option value="Furgoneta Camper">Furgoneta Camper</option>
                            <option value="Gran Volumen">Gran Volumen</option>
                            <option value="Autocaravana">Autocaravana</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ubicación *</label>
                        <input type="text" id="input-location" required placeholder="Madrid" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Año *</label>
                        <input type="number" id="input-year" required placeholder="2018" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kilómetros</label>
                        <input type="number" id="input-km" placeholder="85000" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Plazas Dormir *</label>
                        <input type="number" id="input-sleeps" required placeholder="4" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">URL de la Imagen (Opcional)</label>
                    <input type="url" id="input-image" placeholder="https://..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-lg transition-colors shadow-md">
                    Guardar y Publicar
                </button>
            </form>
        </div>
    </div>

    <!-- Script de Integración Supabase -->
    <script>
        const SUPABASE_URL = 'https://agazyoihnkienkywbpxe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_eCIDgVWRog9savmDZJ1Z-Q_RRYIHMj4';
        
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) {
            console.error("Error al inicializar Supabase:", e);
        }

        let allAds = [];

        async function fetchAds() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient
                    .from('anuncios')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allAds = data || [];
                renderAds(allAds);
            } catch (err) {
                console.error("Error cargando anuncios:", err);
                document.getElementById('ads-grid').innerHTML = `
                    <div class="col-span-full text-center text-red-500 py-8">
                        Error al conectar con la base de datos de Supabase.
                    </div>`;
            }
        }

        function renderAds(ads) {
            const grid = document.getElementById('ads-grid');
            document.getElementById('ad-count').innerText = ads.length;

            if (ads.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No se encontraron vehículos.</div>`;
                return;
            }

            grid.innerHTML = ads.map(ad => `
                <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow flex flex-col">
                    <div class="h-48 bg-slate-100 relative overflow-hidden">
                        <img src="${ad.image || 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=800&q=80'}" alt="${ad.title || 'Camper'}" class="w-full h-full object-cover">
                        <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-white text-xs font-semibold px-2.5 py-1 rounded-full">
                            ${ad.type || 'Camper'}
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h2 class="font-bold text-slate-900 text-lg leading-snug line-clamp-1">${ad.title || 'Vehículo Camper'}</h2>
                            </div>
                            <p class="text-2xl font-black text-brand-600 mb-4">${Number(ad.price || 0).toLocaleString('es-ES')} €</p>
                            
                            <div class="grid grid-cols-2 gap-2 text-xs text-slate-500 mb-4 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                                <div><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i> ${ad.location || 'España'}</div>
                                <div><i class="fa-solid fa-calendar text-slate-400 mr-1"></i> ${ad.year || 'N/D'}</div>
                                <div><i class="fa-solid fa-gauge text-slate-400 mr-1"></i> ${ad.km ? Number(ad.km).toLocaleString('es-ES') + ' km' : 'N/D'}</div>
                                <div><i class="fa-solid fa-bed text-slate-400 mr-1"></i> ${ad.sleeps || 2} Plazas</div>
                            </div>
                        </div>

                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                            <span>Origen: <strong class="text-slate-600">${ad.source || 'Directo'}</strong></span>
                            <span class="bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-medium">${ad.seller_type || 'Particular'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterAds() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const type = document.getElementById('filter-type').value;
            const sleeps = Number(document.getElementById('filter-sleeps').value);

            const filtered = allAds.filter(ad => {
                const matchQuery = (ad.title && ad.title.toLowerCase().includes(query)) || (ad.location && ad.location.toLowerCase().includes(query));
                const matchType = (type === 'Todas') || (ad.type === type);
                const matchSleeps = (sleeps === 0) || (ad.sleeps >= sleeps);
                return matchQuery && matchType && matchSleeps;
            });

            renderAds(filtered);
        }

        function toggleModal(show) {
            document.getElementById('sell-modal').classList.toggle('hidden', !show);
        }

        async function publicarAnuncio(event) {
            event.preventDefault();
            
            const nuevoAnuncio = {
                title: document.getElementById('input-title').value,
                price: Number(document.getElementById('input-price').value),
                location: document.getElementById('input-location').value,
                year: Number(document.getElementById('input-year').value),
                km: Number(document.getElementById('input-km').value) || 0,
                sleeps: Number(document.getElementById('input-sleeps').value),
                type: document.getElementById('input-type').value,
                image: document.getElementById('input-image').value || 'https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=800&q=80',
                seller_type: 'Particular',
                source: 'Publicación Directa'
            };

            try {
                const { error } = await supabaseClient.from('anuncios').insert([nuevoAnuncio]);
                if (error) throw error;
                
                alert('¡Anuncio publicado correctamente!');
                toggleModal(false);
                fetchAds();
            } catch (err) {
                console.error("Error al publicar:", err);
                alert("Error al guardar el anuncio.");
            }
        }

        // Cargar anuncios al iniciar la página
        fetchAds();
    </script>
</body>
</html>
